name: Tests et exécutables

# Lancé sur chaque pull request, sur les étiquettes de version (v2.0.0...) et à la main.
on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  construire:
    name: ${{ matrix.nom }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, nom: Windows,               executable: 'dist/FEC Analyzer.exe',                          livrable: 'dist/FEC Analyzer.exe' }
          - { os: macos-latest,   nom: macOS-Apple-Silicon,   executable: 'dist/FEC Analyzer.app/Contents/MacOS/FEC Analyzer', livrable: 'dist/FEC-Analyzer-macOS.zip' }
          - { os: macos-15-intel, nom: macOS-Intel,           executable: 'dist/FEC Analyzer.app/Contents/MacOS/FEC Analyzer', livrable: 'dist/FEC-Analyzer-macOS.zip' }
    # Actions épinglées par empreinte de commit (version exacte), pas par étiquette modifiable.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1          # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0      # v7.1.0
        with:
          python-version: '3.13'
      - name: Dépendances (versions figées)
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest tests -q
      - name: Construction
        run: python build.py
      - name: Essai de l'application construite
        run: python tests/essai_executable.py "${{ matrix.executable }}"
      - name: Archive macOS
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/FEC Analyzer.app" dist/FEC-Analyzer-macOS.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: FEC-Analyzer-${{ matrix.nom }}
          path: ${{ matrix.livrable }}
          retention-days: 30
