name: Build Windows EXE
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas openpyxl openai fastapi uvicorn python-multipart matplotlib reportlab pyinstaller
      - name: Build EXE
        run: pyinstaller --onefile --noconsole --add-data "index.html;." --add-data "modules;modules" --name "FEC_Analyzer" app.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FEC_Analyzer_Windows
          path: dist/FEC_Analyzer.exe
          retention-days: 30
